<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — TV Survey</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="nav">
        <a href="/" class="nav-brand">TV Survey</a>
        <ul class="nav-links" id="nav-auth">
            <li><a href="/series">Series</a></li>
            <li><a href="/dashboard">Dashboard</a></li>
            <li><button onclick="logout()">Salir</button></li>
        </ul>
        <ul class="nav-links" id="nav-guest" style="display:none;">
            <li><a href="/login">Iniciar sesión</a></li>
        </ul>
    </nav>

    <div class="container-wide">
        <div class="page-header">
            <h1>Dashboard de engagement</h1>
            <p>Métricas de calificaciones por serie.</p>
        </div>

        <div class="card" style="padding:0; overflow:hidden;">
            <div style="padding:1rem 1.5rem; border-bottom:1px solid var(--border); display:flex; justify-content:space-between;">
                <strong>Serie</strong>
                <div style="display:flex; gap:2rem; text-align:center;">
                    <span style="width:60px;">Promedio</span>
                    <span style="width:60px;">Votos</span>
                </div>
            </div>
            <div id="dashboard-list" style="padding:0 1.5rem;">
                <div class="empty-state">Cargando...</div>
            </div>
        </div>

        <p style="text-align:center; margin-top:1.5rem;">
            <a href="/series">← Volver al catálogo</a>
        </p>
    </div>

    <script src="/js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            updateNav();
            if (!isAuthenticated()) {
                window.location.href = '/login';
                return;
            }
            loadDashboard();
        });
    </script>
</body>
</html>
