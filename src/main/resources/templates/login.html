<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión — TV Survey</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="nav">
        <a href="/" class="nav-brand">TV Survey</a>
        <ul class="nav-links">
            <li><a href="/register">Registrarse</a></li>
        </ul>
    </nav>

    <div class="container">
        <div class="page-header">
            <h1>Iniciar sesión</h1>
            <p>Ingresa tus credenciales para continuar.</p>
        </div>

        <div id="alert" class="alert"></div>
        <div id="alert-success" class="alert"></div>

        <form id="form-login" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="tu@email.com" required autocomplete="email">
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
            </div>
            <button type="submit" id="btn-submit" class="btn btn-primary" data-original-text="Iniciar sesión">
                Iniciar sesión
            </button>
        </form>

        <p style="text-align:center; margin-top:1.5rem; color:var(--text-muted);">
            ¿No tienes cuenta? <a href="/register">Regístrate aquí</a>
        </p>
    </div>

    <script src="/js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            updateNav();
            if (isAuthenticated()) window.location.href = '/series';
        });
    </script>
</body>
</html>
